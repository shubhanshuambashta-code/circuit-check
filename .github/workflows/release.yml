name: Build release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-kicad:
    uses: ./.github/workflows/native.yml
  packages:
    needs: native-kicad
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/generate_api_types.py --check
      - run: npm ci --no-audit --no-fund
      - run: npm run test:checks
      - run: python -m pytest -m 'not native'
      - run: npm test --prefix browser-extension
      - run: node --experimental-strip-types --test tests/test_generated_schematic.mjs
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.pages.config.ts
        env:
          PW_CHANNEL: chromium
      - run: python scripts/package_release.py --out-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: circuitcheck-release-packages
          path: release/
          if-no-files-found: error
          retention-days: 30
