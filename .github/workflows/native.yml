name: Native KiCad integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-kicad:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install supported KiCad 10.0 release channel
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version | tee native-engine-version.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -m native --junitxml=native-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-kicad-results
          path: |
            native-engine-version.txt
            native-tests.xml
          retention-days: 14
